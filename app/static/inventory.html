<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management</title>
    <style>
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inventory Management</h1>
        
        <div class="tabs">
            <button onclick="openTab('add')">Add Inventory</button>
            <button onclick="openTab('view')">View Inventory</button>
            <button onclick="generateReport()">Generate Report</button>
            <button onclick="exportInventory()">Export CSV</button>
        </div>
        
        <div id="addTab" class="tabcontent">
            <h2>Add New Inventory Item</h2>
            <form id="inventoryForm">
                <div class="form-group">
                    <label for="name">Medication Name*</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="quantity">Quantity*</label>
                    <input type="number" id="quantity" name="quantity" required>
                </div>
                
                <div class="form-group">
                    <label for="unit_cost">Cost Per Unit ($)</label>
                    <input type="number" step="0.01" id="unit_cost" name="unit_cost">
                </div>
                
                <div class="form-group">
                    <label for="selling_price">Selling Price ($)</label>
                    <input type="number" step="0.01" id="selling_price" name="selling_price">
                </div>
                
                <div class="form-group">
                    <label for="batch_number">Batch Number*</label>
                    <input type="text" id="batch_number" name="batch_number" required>
                </div>
                
                <div class="form-group">
                    <label for="expiration_date">Expiration Date*</label>
                    <input type="date" id="expiration_date" name="expiration_date" required>
                </div>
                
                <div class="form-group">
                    <label for="storage_location">Storage Location</label>
                    <input type="text" id="storage_location" name="storage_location">
                </div>
                
                <div class="form-group">
                    <label for="reorder_level">Reorder Level</label>
                    <input type="number" id="reorder_level" name="reorder_level" value="10">
                </div>
                
                <button type="submit">Add to Inventory</button>
            </form>
        </div>
        
        <div id="viewTab" class="tabcontent" style="display:none">
            <h2>Current Inventory</h2>
            <table id="inventoryTable" border="1" style="width:100%">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Cost</th>
                        <th>Price</th>
                        <th>Batch</th>
                        <th>Expires</th>
                        <th>Location</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Inventory will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function openTab(tabName) {
            document.getElementById('addTab').style.display = 'none';
            document.getElementById('viewTab').style.display = 'none';
            document.getElementById(tabName + 'Tab').style.display = 'block';
        }

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                quantity: parseInt(document.getElementById('quantity').value),
                unit_cost: parseFloat(document.getElementById('unit_cost').value) || 0,
                selling_price: parseFloat(document.getElementById('selling_price').value) || 0,
                batch_number: document.getElementById('batch_number').value,
                expiration_date: new Date(document.getElementById('expiration_date').value).toISOString(),
                storage_location: document.getElementById('storage_location').value,
                reorder_level: parseInt(document.getElementById('reorder_level').value) || 10
            };
            
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if(response.ok) {
                    alert(`Item added successfully! ID: ${result.item_id}`);
                    document.getElementById('inventoryForm').reset();
                } else {
                    alert(`Error: ${result.detail || 'Unknown error'}`);
                }
            } catch (error) {
                alert('Failed to connect to server');
            }
        });

        async function loadInventory() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/v1/inventory');
                const items = await response.json();
                
                const tableBody = document.querySelector('#inventoryTable tbody');
                tableBody.innerHTML = '';
                
                items.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.name}</td>
                        <td>${item.quantity}</td>
                        <td>$${item.unit_cost.toFixed(2)}</td>
                        <td>$${item.selling_price.toFixed(2)}</td>
                        <td>${item.batch_number}</td>
                        <td>${new Date(item.expiration_date).toLocaleDateString()}</td>
                        <td>${item.storage_location}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }

        function generateReport() {
            fetch('http://127.0.0.1:8000/api/v1/inventory/report', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message))
                .catch(error => alert('Report generation failed'));
        }

        function exportInventory() {
            window.open('http://127.0.0.1:8000/api/v1/inventory/export', '_blank');
        }

        // Load inventory when viewing tab
        document.querySelector('button[onclick="openTab(\'view\')"]')
            .addEventListener('click', loadInventory);
    </script>
</body>
</html>
