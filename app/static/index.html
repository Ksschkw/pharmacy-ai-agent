<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Prescription</title>
</head>
<body>
    <h1>Upload Prescription</h1>
    <form action="http://127.0.0.1:8000/api/v1/prescriptions/upload" method="post" enctype="multipart/form-data">
        <label for="patient_id">Patient ID:</label>
        <input type="text" id="patient_id" name="patient_id" required><br><br>
        
        <label for="physician_id">Physician ID:</label>
        <input type="text" id="physician_id" name="physician_id" required><br><br>
        
        <label for="prescription_number">Prescription Number:</label>
        <input type="text" id="prescription_number" name="prescription_number" required><br><br>
        
        <label for="priority">Priority:</label>
        <select id="priority" name="priority">
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
        </select><br><br>
        
        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes"></textarea><br><br>
        
        <label for="file">Upload File (Image):</label>
        <input type="file" id="file" name="file"><br><br>
        
        <input type="submit" value="Submit">
    </form>
</body>
</html>
